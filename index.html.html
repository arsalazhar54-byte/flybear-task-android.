<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F57C00">
<title>Flybear Task</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF1E0;--sf:#fff;--ink:#3A1F0A;--mu:#8A6A4C;--ln:#F2D3AE;--ac:#F57C00;--ac2:#FFB347;--on:#fff;--ok:#2E8B57;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=night]{color-scheme:dark;--bg:#17110C;--sf:#26190F;--ink:#FDEBD6;--mu:#C2A483;--ln:#43301F;--ac:#FF8F1F;--ac2:#FFC166;--on:#2A1500;--ok:#6FCF97;--bad:#EF6B5C}
[data-theme=ocean]{--bg:#E8F3FB;--sf:#fff;--ink:#0F2A40;--mu:#53708A;--ln:#BFD9EC;--ac:#1E78C8;--ac2:#6DB6EE}
[data-theme=forest]{--bg:#EAF4EA;--sf:#fff;--ink:#12301C;--mu:#58745E;--ln:#C3DEC5;--ac:#2E8B57;--ac2:#7BCB9B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:var(--logo) center 55%/min(80vw,420px) no-repeat;opacity:.09;pointer-events:none}
h1,h2,h3,.cn{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.lg{display:inline-block;line-height:0}.lg img{width:100%;height:100%;object-fit:contain}
.brand{font:700 26px "Barlow Condensed",sans-serif;color:var(--ac);text-shadow:1px 1px 0 #fff8,2px 2px 0 rgba(0,0,0,.18)}
#auth,#welcome{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,var(--ac2),var(--ac));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;overflow:auto}
#auth .lg,#welcome .lg{width:140px;height:140px;filter:drop-shadow(0 14px 12px rgba(0,0,0,.3));animation:fly 3s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-12px) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){#auth .lg,#welcome .lg{animation:none}}
#auth h1,#welcome h1{font-size:44px;text-shadow:2px 3px 0 rgba(0,0,0,.25)}
.card{background:var(--sf);color:var(--ink);border-radius:16px;padding:16px;width:100%;max-width:360px;margin-top:16px;text-align:left}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:var(--bg);font-weight:600}
.tabs .on{background:var(--ac);color:var(--on)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:500 16px Barlow,sans-serif}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:700 20px "Barlow Condensed",sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--bg);color:var(--ink);box-shadow:none;border:1px solid var(--ln)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--ln)}
header .lg{width:42px;height:42px;padding:3px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 3px 0 rgba(0,0,0,.2)}
.hb{margin-left:auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:22px}
main{max-width:560px;margin:0 auto;padding:12px 14px 110px}
.dn{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dn button{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:20px}
.dn b{flex:1;text-align:center}
.board{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);border-radius:14px;padding:14px 16px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.board .cn{font-size:42px;font-weight:700;line-height:1}
.bar{height:9px;background:rgba(255,255,255,.4);border-radius:5px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px -14px 0;padding:2px 14px 6px;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle at 30% 25%,#fff9 0,transparent 40%),linear-gradient(145deg,var(--ac2),var(--ac));box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.2);text-shadow:0 2px 2px rgba(0,0,0,.3)}
.t{display:flex;gap:12px;align-items:flex-start;background:var(--sf);border-radius:14px;padding:12px;margin-top:9px;border:1px solid var(--ln)}
.t.done{opacity:.72}.t.done .ti{text-decoration:line-through}
.bd{flex:1;min-width:0}.ti{font-weight:600;overflow-wrap:anywhere}.me{font-size:13px;color:var(--mu)}
.ck{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--ac);background:none;font-size:18px;color:#fff;padding:0}
.t.done .ck{background:var(--ok);border-color:var(--ok)}
.x{flex:none;background:none;border:0;font-size:22px;color:var(--mu);padding:2px 6px}
.ci{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:10px;background:var(--bg)}
.ci img{width:46px;height:46px;object-fit:cover;border-radius:8px}
.ci .tx{flex:1;font-size:14px;font-weight:600}
.sm{padding:8px 11px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:14px;display:inline-block}
.sm.d{color:var(--bad)}
.empty{border:2px dashed var(--ln);border-radius:14px;padding:22px;text-align:center;color:var(--mu);margin-top:10px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:58px;padding:0 24px;border:0;border-radius:29px;background:var(--ac);color:var(--on);font:700 21px "Barlow Condensed",sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--sf);border-radius:10px;overflow:hidden}
th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left}th{background:var(--ac);color:var(--on)}td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tot div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px}.tot b{display:block;font:700 28px "Barlow Condensed",sans-serif;color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 10px 8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mu)}
.bars i{width:100%;background:linear-gradient(var(--ac2),var(--ac));border-radius:6px 6px 0 0;min-height:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:9px;padding:12px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);font-weight:600}
.th.on{border-color:var(--ac)}.th i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
#drawer{position:fixed;inset:0;z-index:15;background:rgba(20,10,0,.5)}
#drawer nav{position:absolute;right:0;top:0;bottom:0;width:min(290px,85vw);background:var(--sf);padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;display:flex;flex-direction:column;gap:4px}
#drawer nav button{display:flex;gap:10px;align-items:center;padding:13px;border:0;border-radius:10px;background:none;font-weight:600;font-size:17px;text-align:left}
#drawer nav button.on{background:var(--bg);color:var(--ac)}
dialog{border:0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:auto auto 0;background:var(--sf);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(20,10,0,.55)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);font-size:12px;font-weight:600}
.tg button.on{border-color:var(--ac)}.tg .ico{width:40px;height:40px;font-size:21px}
#banner{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center}
#banner button{margin-left:auto;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:var(--on);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:40;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pill{font-size:12px;font-weight:700;background:var(--ac);color:var(--on);border-radius:20px;padding:3px 9px;white-space:nowrap}
</style>
</head>
<body data-theme="orange">

<section id="auth" hidden>
  <span class="lg"></span>
  <h1>Flybear Task</h1>
  <p style="margin:4px 0 0;opacity:.95">Your warehouse day, organised.</p>
  <form class="card" id="af">
    <div class="tabs"><button type="button" id="tl" class="on">Log in</button><button type="button" id="ts">Sign up</button></div>
    <label for="un">Username</label><input id="un" autocomplete="username" required minlength="3" maxlength="24">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required minlength="4">
    <div id="whw" hidden><label for="wh">Warehouse</label><select id="wh"><option>Warehouse 1</option><option>Warehouse 2</option><option>Warehouse 3</option></select></div><div class="err" id="ae"></div>
    <button class="btn" id="ab" style="margin-top:4px">Log in</button>
  </form>
</section>

<section id="welcome" hidden>
  <span class="lg"></span>
  <h1>Welcome, <span id="wn"></span>!</h1>
  <p style="max-width:300px">Log inbound, sorting, racking, picking and your closing checklist all in one place.</p>
  <button class="btn" id="go" style="max-width:260px;background:#fff;color:var(--ac)">Start my day</button>
</section>

<div id="app" hidden>
  <header><span class="lg"></span><span class="brand">Flybear Task</span><span class="pill" id="whl"></span><button class="hb" id="hb" aria-label="Open menu">☰</button></header>
  <main id="view"></main>
  <button class="fab" id="fab">+ Add task</button>
</div>

<div id="drawer" hidden><nav id="nav"></nav></div>
<div id="banner" hidden><span>🔔 It’s time to switch off AC, fans and lights.</span><button id="bok">OK</button></div>

<dialog id="dlg"><form method="dialog" id="df">
  <div class="tg" id="tg"></div>
  <div id="ff"></div>
  <div class="row2"><button type="button" class="btn alt" id="dc">Cancel</button><button class="btn">Save task</button></div>
</form></dialog>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const shift=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Storage is full. Delete some photos.');return false}};
let isAdm=false,db=null,chat=[],user=null,D=null,day=today(),view='tasks',flt='All',mode='in',ctype='inbound';
function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const save=()=>{const ok=sv('fb.d.'+user,D);report();return ok};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fb:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(s)}}

/* auth */
function showAuth(){$('auth').hidden=false;$('app').hidden=true}
$('tl').onclick=()=>setMode('in');$('ts').onclick=()=>setMode('up');
function setMode(m){mode=m;$('tl').className=m=='in'?'on':'';$('ts').className=m=='up'?'on':'';$('ab').textContent=m=='in'?'Log in':'Create account';$('ae').textContent='';$('whw').hidden=m=='in'}
$('af').onsubmit=async e=>{e.preventDefault();const u=$('un').value.trim().toLowerCase(),h=await hash($('pw').value),U=ld('fb.users')||{};
  if(mode=='up'){if(U[u]){$('ae').textContent='That username is taken. Pick another or log in.';return}U[u]={h,wh:$('wh').value};sv('fb.users',U)}
  else if((typeof U[u]==='string'?U[u]:U[u]&&U[u].h)!==h){$('ae').textContent='Wrong username or password.';return}
  sv('fb.session',u);enter(u,true)};
function enter(u,greet){user=u;D=ld('fb.d.'+u)||{tasks:[],theme:'orange',remind:true};{const r=(ld('fb.users')||{})[u];D.wh=(r&&r.wh)||D.wh||'Warehouse 1'}setTheme(D.theme);$('auth').hidden=true;
  if(greet){$('wn').textContent=u;$('welcome').hidden=false}else start()}
$('go').onclick=()=>{$('welcome').hidden=true;start()};
function start(){$('app').hidden=false;$('whl').textContent=D.wh;initCloud();day=today();view='tasks';ensureClose();render();if(D.remind&&'Notification'in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(e){}}
function setTheme(t){D.theme=t;document.body.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=TH[t][1]}
function ensureClose(){const t=today();if(!D.tasks.some(x=>x.date===t&&x.type==='close')){D.tasks.push({id:'c'+t,date:t,type:'close',photos:{}});save()}}

const NAV=[['tasks','📋','Tasks'],['results','📊','Results sheet'],['progress','📈','Progress'],['records','🗄️','Previous records'],['themes','🎨','Themes'],['help','🤖','Ask Flybear AI'],['settings','⚙️','Settings'],['out','🚪','Log out']];
$('hb').onclick=()=>{$('nav').innerHTML=(isAdm?[['admin','🛡️','Admin: all users'],...NAV]:NAV).map(n=>`<button data-v="${n[0]}" class="${n[0]==view?'on':''}"><span>${n[1]}</span>${n[2]}</button>`).join('');$('drawer').hidden=false};
$('drawer').onclick=e=>{const b=e.target.closest('button');if(e.target.id==='drawer'){$('drawer').hidden=true;return}if(!b)return;$('drawer').hidden=true;
  if(b.dataset.v==='out'){try{localStorage.removeItem('fb.session')}catch(x){}user=null;showAuth();return}view=b.dataset.v;render()};

/* helpers */
const dur=t=>{if(!t.start||!t.end)return 0;const a=t.start.split(':'),b=t.end.split(':');let m=(b[0]*60+ +b[1])-(a[0]*60+ +a[1]);return m<0?m+1440:m};
const sum=(arr,k)=>arr.reduce((s,t)=>s+(+t[k]||0),0);
function info(t){const p=[];if(t.cust)p.push(esc(t.cust));if(t.rack)p.push('Rack '+esc(t.rack));if(t.order)p.push('Order '+esc(t.order));if(t.orders)p.push(t.orders+' orders');if(t.pcs)p.push(t.pcs+' pieces');if(t.ctn)p.push(t.ctn+' Ctn');if(t.start)p.push(t.start+'–'+(t.end||'…')+(dur(t)?' ('+dur(t)+' min)':''));return p.join(' · ')}
const isDone=t=>t.type==='close'?CL.every(c=>t.photos[c[0]]):t.done;
const dayT=d=>D.tasks.filter(t=>t.date===d);
const pct=d=>{const a=dayT(d);return a.length?Math.round(a.filter(isDone).length/a.length*100):0};
const dlabel=d=>d===today()?'Today':new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function dnav(){return`<div class="dn"><button data-a="d-">‹</button><b>${dlabel(day)}</b><button data-a="d+">›</button></div>`}

/* views */
function render(){const v=$('view');({tasks:vTasks,results:vResults,progress:vProgress,records:vRecords,themes:vThemes,settings:vSettings,help:vHelp,admin:vAdmin})[view](v);$('fab').hidden=view!=='tasks';window.scrollTo(0,0)}
function vTasks(v){const a=dayT(day),n=a.filter(isDone).length;
  let h=dnav()+`<div class="board"><div class="cn">${n} / ${a.length}</div><div>tasks done</div><div class="bar"><i style="width:${pct(day)}%"></i></div></div>`;
  h+=`<div class="chips">`+['All',...Object.keys(T)].map(k=>`<button class="chip ${flt==k?'on':''}" data-f="${k}">${k=='All'?'All':T[k][0]}</button>`).join('')+`</div>`;
  const s=a.filter(t=>flt=='All'||t.type==flt).sort((x,y)=>isDone(x)-isDone(y));
  h+=s.length?s.map(card).join(''):`<div class="empty">No tasks here yet. Tap “Add task” to log your work.</div>`;
  if(day!==today())h+=`<button class="btn alt" data-a="today">Jump to today</button>`;
  const pv=D.tasks.filter(t=>t.date===shift(day,-1)&&t.type!=='close'&&!t.done);
  if(pv.length)h+=`<button class="btn alt" data-a="carry">Carry over ${pv.length} unfinished from the day before</button>`;
  v.innerHTML=h}
function card(t){const y=T[t.type];
  if(t.type==='close')return`<div class="t ${isDone(t)?'done':''}"><span class="ico">${y[1]}</span><div class="bd"><div class="ti">Closing checklist</div><div class="me">Take a photo after each step. Done when all 4 are shown.</div>`+CL.map(c=>{const p=t.photos[c[0]];return`<div class="ci">${p?`<img src="${p}" alt="${c[1]}">`:`<span style="font-size:26px">${c[2]}</span>`}<span class="tx">${c[1]}</span><label class="sm">${p?'Retake':'📷 Photo'}<input type="file" accept="image/*" capture="environment" hidden data-ph="${t.id}|${c[0]}"></label>${p?`<button class="sm d" data-a="dph" data-id="${t.id}|${c[0]}" aria-label="Delete photo">Delete</button>`:''}</div>`}).join('')+`</div></div>`;
  return`<div class="t ${t.done?'done':''}" style="${cuo(t)?'border-left:6px solid '+cuo(t)[0]:''}">${ic2(t)}<div class="bd"><div class="ti">${esc(t.title||y[0])}</div><div class="me">${y[0]}${info(t)?' · '+info(t):''}</div></div><button class="ck" data-a="tg" data-id="${t.id}" aria-label="Toggle done">${t.done?'✓':''}</button><button class="x" data-a="del" data-id="${t.id}" aria-label="Delete task">×</button></div>`}

function vResults(v){const a=dayT(day).filter(t=>t.type!=='close'),inb=a.filter(t=>t.type=='inbound'),pk=a.filter(t=>t.type=='pick');
  const bm=sum(a.filter(t=>t.type=='brk').map(t=>({m:dur(t)})),'m'),pm=sum(a.filter(t=>t.type=='pray').map(t=>({m:dur(t)})),'m'),cl=dayT(day).find(t=>t.type=='close');
  v.innerHTML=dnav()+`<h2>Results sheet</h2><div class="tot"><div><b>${sum(inb,'pcs')}</b>Inbound pieces</div><div><b>${sum(inb,'ctn')}</b>Inbound Ctn</div><div><b>${sum(pk,'orders')}</b>Orders picked</div><div><b>${sum(pk,'pcs')}</b>Picked pieces</div><div><b>${bm} min</b>Break time</div><div><b>${pm} min</b>Prayer time</div></div>${chartHtml()}${custTable()}<div class="scroll"><table><tr><th>Task</th><th>Details</th><th class="r">Pieces</th><th class="r">Ctn</th><th>Status</th></tr>${a.map(t=>`<tr><td>${T[t.type][1]} ${esc(t.title||T[t.type][0])}</td><td>${[t.rack&&'Rack '+esc(t.rack),t.order&&'Order '+esc(t.order),t.orders&&t.orders+' orders',t.start&&t.start+'–'+(t.end||'')].filter(Boolean).join(', ')}</td><td class="r">${t.pcs||''}</td><td class="r">${t.ctn||''}</td><td>${t.done?'Done':'Open'}</td></tr>`).join('')||'<tr><td colspan="5">No tasks logged.</td></tr>'}</table></div>
  <p class="me">Closing checklist: ${cl&&isDone(cl)?'complete ✓':'not complete'}</p><button class="btn" data-a="pdf">Download PDF</button><button class="btn alt" data-a="copy">Copy sheet as text</button>`}
function sheetText(){const a=dayT(day).filter(t=>t.type!=='close');return'Flybear Task – '+dlabel(day)+'\n'+a.map(t=>[T[t.type][0],t.title,info(t).replace(/&amp;/g,'&'),t.done?'Done':'Open'].filter(Boolean).join(' | ')).join('\n')}

function vProgress(v){const ds=[...Array(7)].map((_,i)=>shift(today(),i-6)),w=D.tasks.filter(t=>ds.includes(t.date)),wi=w.filter(t=>t.type=='inbound'),wp=w.filter(t=>t.type=='pick');
  v.innerHTML=`<h2>Progress</h2><p class="me">Task completion over the last 7 days</p><div class="bars">${ds.map(d=>`<div><span>${pct(d)}%</span><i style="height:${pct(d)}%"></i><span>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`).join('')}</div>
  <div class="tot"><div><b>${w.filter(isDone).length}/${w.length}</b>Tasks done this week</div><div><b>${sum(wi,'pcs')}</b>Inbound pieces</div><div><b>${sum(wi,'ctn')}</b>Inbound Ctn</div><div><b>${sum(wp,'orders')}</b>Orders picked</div></div>`}
function vRecords(v){const ds=[...new Set(D.tasks.map(t=>t.date))].sort().reverse();
  v.innerHTML=`<h2>Previous records</h2>`+(ds.map(d=>`<button class="th" data-a="open" data-id="${d}"><span class="ico">🗄️</span><span style="flex:1">${dlabel(d)}<br><span class="me">${dayT(d).filter(isDone).length} of ${dayT(d).length} tasks done</span></span>›</button>`).join('')||'<div class="empty">No saved records yet.</div>')}
function vThemes(v){v.innerHTML=`<h2>Themes</h2>`+Object.entries(TH).map(([k,c])=>`<button class="th ${D.theme==k?'on':''}" data-a="theme" data-id="${k}"><i style="--c1:${c[1]};--c2:${c[2]}"></i>${c[0]}</button>`).join('')}
function vSettings(v){v.innerHTML=`<h2>Settings</h2><div class="card" style="max-width:none;margin-top:10px"><b>Closing reminder</b><p class="me">Every Sunday to Friday at 9:55 PM: switch off AC, fans and lights. This banner and a notification show while the app is open. A phone alarm at the same time is set up by Claude in chat.</p><button class="btn" data-a="rem">${D.remind?'Reminder is on – tap to turn off':'Reminder is off – tap to turn on'}</button><button class="btn alt" data-a="test">Test reminder</button></div>
  <div class="card" style="max-width:none"><b>Account</b><p class="me">Signed in as ${esc(user)}. Data is stored only on this device. Login is basic and local, so don’t reuse an important password.</p><button class="btn alt" data-a="wipe">Delete all my tasks</button></div>`}

function custTable(){const m={};dayT(day).filter(t=>t.cust).forEach(t=>{const r=m[t.cust]=m[t.cust]||{a:0,p:0,pc:0};if(t.type=='assign')r.a+=+t.orders||0;if(t.type=='pick'){r.p+=+t.orders||0;r.pc+=+t.pcs||0}});const k=Object.keys(m);
  return`<h3 style="margin:12px 0 6px">Orders by customer</h3><div class="scroll"><table><tr><th>Customer</th><th class="r">Assigned</th><th class="r">Picked</th><th class="r">Pieces</th></tr>${k.map(n=>`<tr><td>${C[n]?C[n][1]:''} ${esc(n)}</td><td class="r">${m[n].a}</td><td class="r">${m[n].p}</td><td class="r">${m[n].pc}</td></tr>`).join('')||'<tr><td colspan="4">No customer orders yet.</td></tr>'}</table></div><div style="height:10px"></div>`}
const QA=[[/previous|record|history|old|past|saved/,'Open the menu (☰, top right) and tap “Previous records”. Tap any date to open that day’s tasks.',['records','Open Previous records']],
[/progress|chart|graph|week|performance/,'“Progress” shows the last 7 days and your weekly totals.',['progress','Open Progress']],
[/result|sheet|total|report|copy/,'“Results sheet” shows totals for the selected day, including orders by customer. Use the arrows to change the day.',['results','Open Results sheet']],
[/clos|photo|gate|lock|oven|light|fan|\bac\b/,'On the Tasks page, open the Closing checklist card. Take a photo for the oven, lights, AC and fans, and main gate lock. With all four photos it is complete. Tap Delete to remove a photo.'],
[/assign|order|customer|pick/,'Tap “+ Add task”, choose “Assign orders” or “Order picking”, pick the customer, then enter the number of orders and the order number.'],
[/theme|colou?r|dark|night/,'Open the menu and tap “Themes” to switch between Orange, Night, Ocean and Forest.',['themes','Open Themes']],
[/remind|alarm|notif|9:55/,'Reminders are in Settings. The 9:55 PM Sunday to Friday phone alarm is set in your phone’s clock app.',['settings','Open Settings']],
[/warehouse|admin|user|login|password|account/,'Each account belongs to one warehouse, chosen at sign up. The admin sees all users and warehouses on the Admin page.']];
async function doAsk(q){chat.push({q});const r=QA.find(x=>x[0].test(q.toLowerCase()));let a='',b;
  if(r){a=r[1];b=r[2]}else{try{const sm=await claude.use('sample');if(sm){const o=await sm('You are the help assistant inside Flybear Task, a warehouse task app. Menu (☰): Tasks, Results sheet, Progress, Previous records, Themes, Ask Flybear AI, Settings, Log out. Tasks: inbound pieces and Ctn, stock sorting, put on racks, tag pieces, assign orders and order picking per customer, refilling, break, prayer, closing checklist with 4 photos (oven, lights, AC and fans, main gate). Answer in at most 2 short sentences. Question: '+q);a=o.text}}catch(e){}
    if(!a)a='I’m not sure. Try asking about previous records, progress, the results sheet, closing photos, assigning orders, themes or reminders.'}
  Object.assign(chat[chat.length-1],{a,b});render()}
function vHelp(v){v.innerHTML=`<h2>Ask Flybear AI</h2><p class="me">Ask how to do anything in the app.</p><div class="chips" style="flex-wrap:wrap">${['How do I see previous records?','Where is my previous progress?','How do I assign orders?','How does the closing checklist work?'].map(s=>`<button class="chip" data-a="ask" data-id="${s}">${s}</button>`).join('')}</div>${chat.map(c=>`<div class="t"><div class="bd"><div class="me">You: ${esc(c.q)}</div><div class="ti" style="font-weight:500">${c.a?esc(c.a):'Thinking…'}</div>${c.b?`<button class="btn" data-a="nav" data-id="${c.b[0]}">${c.b[1]}</button>`:''}</div></div>`).join('')}<label for="hq">Your question</label><input id="hq" placeholder="e.g. how to see previous records"><button class="btn" data-a="send">Ask</button>`}
async function initCloud(){try{const u=await claude.use('user');isAdm=!!(u&&u.isOwner());db=await claude.use('db');report()}catch(e){db=null}}
function report(){if(!db||!user||!D)return;try{const a=dayT(today()),p=a.filter(t=>t.type=='pick'),i=a.filter(t=>t.type=='inbound');db.collection('reports').doc(user).set({name:user,wh:D.wh,date:today(),done:a.filter(isDone).length,total:a.length,inPcs:sum(i,'pcs'),inCtn:sum(i,'ctn'),orders:sum(p,'orders'),pcs:sum(p,'pcs'),at:Date.now()}).catch(()=>{})}catch(e){}}
async function vAdmin(v){v.innerHTML='<h2>Admin: all users</h2><p class="me">Loading…</p>';let rows=[];try{if(!db)db=await claude.use('db');const sn=await db.collection('reports').get();rows=sn.docs.map(d=>d.data())}catch(e){}
  rows.sort((a,b)=>(a.wh||'')>(b.wh||'')?1:-1);
  v.innerHTML=`<h2>Admin: all users</h2><p class="me">Users who opened the app while connected. Passwords are never stored here.</p>`+(rows.length?`<div class="scroll"><table><tr><th>User</th><th>Warehouse</th><th class="r">Done</th><th class="r">Inbound pcs</th><th class="r">Orders</th><th>Date</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.wh)}</td><td class="r">${r.done}/${r.total}</td><td class="r">${r.inPcs}</td><td class="r">${r.orders}</td><td>${esc(r.date)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No user data yet, or the cloud isn’t connected. This works when the app is opened from Claude.</div>')}
function stats(){const a=dayT(day),by={};a.forEach(t=>{const r=by[t.type]=by[t.type]||{n:0,d:0};r.n++;if(isDone(t))r.d++});return{a,by,d:a.filter(isDone).length}}
function chartHtml(){const{a,by,d}=stats(),p=a.length?d/a.length:0,R=42,L=2*Math.PI*R;
  return`<h3 style="margin:12px 0 6px">Progress chart</h3><div class="card" style="max-width:none;margin:0 0 10px"><div style="display:flex;gap:14px;align-items:center"><svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="${Math.round(p*100)}% done"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--ln)" stroke-width="14"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--ac)" stroke-width="14" stroke-dasharray="${L*p} ${L}" transform="rotate(-90 55 55)" stroke-linecap="round"/><text x="55" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${Math.round(p*100)}%</text></svg><div style="flex:1">${Object.keys(by).map(k=>`<div class="me">${T[k][1]} ${T[k][0]} ${by[k].d}/${by[k].n}</div><div class="bar" style="background:var(--ln);margin:2px 0 6px"><i style="width:${by[k].d/by[k].n*100}%;background:var(--ac)"></i></div>`).join('')||'<span class="me">No tasks yet.</span>'}</div></div></div>`}
async function mkPdf(){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('PDF tool could not load');return}
  const{a,by,d}=stats(),doc=new J({unit:'pt',format:'a4'});let y=96;const inb=a.filter(t=>t.type=='inbound'),pk=a.filter(t=>t.type=='pick');
  doc.setFillColor(245,124,0);doc.rect(0,0,595,70,'F');
  if(window.ICON)try{doc.addImage(window.ICON,'PNG',24,12,46,46)}catch(e){}
  doc.setTextColor(255);doc.setFontSize(20);doc.text('Flybear Task - Results sheet',82,34);doc.setFontSize(11);doc.text(dlabel(day)+' | '+user+' | '+D.wh,82,52);
  doc.setTextColor(30);doc.setFontSize(12);
  doc.text('Inbound: '+sum(inb,'pcs')+' pieces, '+sum(inb,'ctn')+' Ctn    Orders picked: '+sum(pk,'orders')+'    Picked pieces: '+sum(pk,'pcs'),40,y);y+=22;
  doc.text('Tasks done: '+d+' of '+a.length,40,y);y+=12;
  doc.setFillColor(230,230,230);doc.rect(40,y,300,10,'F');doc.setFillColor(245,124,0);doc.rect(40,y,a.length?300*d/a.length:0,10,'F');y+=28;
  Object.keys(by).forEach(k=>{doc.setFontSize(10);doc.text(T[k][0]+'  '+by[k].d+'/'+by[k].n,40,y+8);doc.setFillColor(230,230,230);doc.rect(180,y,160,9,'F');doc.setFillColor(245,124,0);doc.rect(180,y,160*by[k].d/by[k].n,9,'F');y+=16});
  y+=12;doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Task',40,y);doc.text('Details',200,y);doc.text('Status',500,y);doc.setFont(undefined,'normal');y+=6;doc.line(40,y,555,y);y+=14;
  a.forEach(t=>{if(y>790){doc.addPage();y=50}doc.setFontSize(10);doc.text(doc.splitTextToSize(T[t.type][0]+(t.title?' - '+t.title:''),150)[0],40,y);doc.text(doc.splitTextToSize(info(t).replace(/&amp;/g,'&'),290)[0]||'',200,y);doc.text(isDone(t)?'Done':'Open',500,y);y+=16});
  const fn='flybear-results-'+day+'.pdf',blob=doc.output('blob');
  try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  doc.save(fn)}
/* events */
document.addEventListener('click',e=>{const c=e.target.closest('[data-f],[data-a]');if(!c)return;
  if(c.dataset.f){flt=c.dataset.f;render();return}
  const a=c.dataset.a,id=c.dataset.id;
  if(a=='d-'){day=shift(day,-1);render()}else if(a=='d+'){day=shift(day,1);render()}else if(a=='today'){day=today();render()}
  else if(a=='tg'){const t=D.tasks.find(x=>x.id==id);t.done=!t.done;save();render()}
  else if(a=='del'){if(confirm('Delete this task?')){D.tasks=D.tasks.filter(x=>x.id!=id);save();render()}}
  else if(a=='dph'){const[i,k]=id.split('|');if(confirm('Delete this photo?')){delete D.tasks.find(x=>x.id==i).photos[k];save();render()}}
  else if(a=='carry'){D.tasks.filter(t=>t.date==shift(day,-1)&&t.type!=='close'&&!t.done).forEach(t=>t.date=day);save();render()}
  else if(a=='open'){day=id;view='tasks';render()}
  else if(a=='theme'){setTheme(id);save();render()}
  else if(a=='rem'){D.remind=!D.remind;save();render()}
  else if(a=='test')remind(true)
  else if(a=='wipe'){if(confirm('Delete every task and photo on this account?')){D.tasks=[];save();ensureClose();render()}}
  else if(a=='pdf')mkPdf();else if(a=='ask')doAsk(id);else if(a=='send'){const q=$('hq');if(q.value.trim())doAsk(q.value.trim())}else if(a=='nav'){view=id;render()}else if(a=='copy'){try{navigator.clipboard.writeText(sheetText()).then(()=>toast('Sheet copied'),()=>toast('Copy not allowed here'))}catch(x){toast('Copy not allowed here')}}});
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0],k=e.target.dataset.ph;if(!f||!k)return;
  const[i,c]=k.split('|'),r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);D.tasks.find(x=>x.id==i).photos[c]=cv.toDataURL('image/jpeg',.6);save();render()};im.src=r.result};r.readAsDataURL(f)});

/* add dialog */
$('fab').onclick=()=>{ctype='inbound';drawDlg();$('dlg').showModal()};
$('dc').onclick=()=>$('dlg').close();
function drawDlg(){$('tg').innerHTML=Object.entries(T).map(([k,y])=>`<button type="button" data-ty="${k}" class="${k==ctype?'on':''}"><span class="ico">${y[1]}</span>${y[0]}</button>`).join('');
  const fs=T[ctype][2];$('ff').innerHTML=ctype=='close'?'<p class="me">A closing checklist is added for today automatically.</p>':`<label for="f-title">Note (optional)</label><input id="f-title" maxlength="80" placeholder="e.g. Container 4471">`+`<div class="row2">`+fs.map(f=>(f=='cust'?`<div style="grid-column:1/-1"><label for="f-cust">Customer</label><select id="f-cust">${Object.keys(C).map(k=>`<option>${esc(k)}</option>`).join('')}</select></div>`:`<div><label for="f-${f}">${F[f]}</label><input id="f-${f}" ${f=='start'||f=='end'?'type="time"':f=='pcs'||f=='ctn'||f=='orders'?'type="number" min="0" inputmode="numeric"':'maxlength="30"'}></div>`)).join('')+`</div>`}
$('tg').onclick=e=>{const b=e.target.closest('[data-ty]');if(b){ctype=b.dataset.ty;drawDlg()}};
$('df').onsubmit=()=>{if(ctype=='close'){ensureClose();render();return}
  const t={id:Date.now()+Math.random().toString(36).slice(2,5),date:day,type:ctype,done:false,title:$('f-title').value.trim()};
  T[ctype][2].forEach(f=>t[f]=$('f-'+f).value.trim());D.tasks.push(t);save();render()};

/* reminder: Sun–Fri 21:55 while app is open */
function remind(force){$('banner').hidden=false;try{if('Notification'in window&&Notification.permission==='granted')new Notification('Flybear Task',{body:'Time to switch off AC, fans and lights.'})}catch(e){}if(force)setTimeout(()=>$('banner').hidden=true,5000)}
$('bok').onclick=()=>$('banner').hidden=true;
setInterval(()=>{if(!user||!D||!D.remind)return;const n=new Date(),k=iso(n)+'r';if(n.getDay()<=5&&n.getHours()==21&&n.getMinutes()==55&&D.fired!==k){D.fired=k;save();remind()}},15000);

const ss=ld('fb.session');if(ss&&(ld('fb.users')||{})[ss])enter(ss,false);else showAuth();
// Service worker disabled in the packaged Android WebView build.
</script>
